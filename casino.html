<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASINO — Simonsen Fjord & Fest</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --red: #d42020; --red-glow: rgba(212,32,32,0.7); }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    /* ── YouTube-overlay ── */
    #video-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 1.2s ease;
    }
    /* Fullscreen YT-cover (16:9 → dekker alltid hele viewporten) */
    #yt-wrap {
      position: absolute; inset: 0; overflow: hidden;
      pointer-events: none;
    }
    #yt-wrap iframe {
      position: absolute;
      /* Dekker hele skjermen uansett aspect ratio */
      width: 100vw; height: 56.25vw;      /* 16:9 basert på bredde */
      min-height: 100vh; min-width: 177.78vh; /* 16:9 basert på høyde */
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border: none;
    }
    /* Svart maske over bunnen der teksting vises */
    #subtitle-mask {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 16%; background: #000;
      pointer-events: none; z-index: 5;
    }
    /* Logo i det svarte feltet nederst */
    #subtitle-mask {
      display: flex; align-items: center; padding-left: 24px;
    }
    #video-logo {
      display: flex; align-items: center; gap: 10px;
      pointer-events: none;
    }
    #video-logo .logo-text { display: flex; flex-direction: column; line-height: 1; }
    #video-logo .logo-name {
      font-family: 'Inter', sans-serif; font-weight: 800;
      font-size: 0.95rem; letter-spacing: 0.06em; color: #fff;
    }
    #video-logo .logo-sub {
      font-family: 'Inter', sans-serif; font-weight: 600;
      font-size: 0.6rem; letter-spacing: 0.22em;
      color: #d42020; margin-top: 3px;
    }

    /* Klikk-for-å-starte-skjerm */
    #tap-screen {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px; cursor: pointer;
      background: rgba(0,0,0,0.72);
      transition: opacity 0.4s ease;
    }
    #tap-screen .tap-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 12vw, 7rem);
      letter-spacing: 0.06em; color: #fff;
      text-shadow: 0 0 60px var(--red-glow);
    }
    #tap-screen .tap-hint {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem; letter-spacing: 0.3em;
      text-transform: uppercase; color: #888;
      animation: blink 1.8s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:0.4} 50%{opacity:1} }
    #tap-screen .tap-play-btn {
      width: 72px; height: 72px; border-radius: 50%;
      border: 2px solid var(--red);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; color: #fff;
      box-shadow: 0 0 30px rgba(212,32,32,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #tap-screen:hover .tap-play-btn {
      transform: scale(1.1);
      box-shadow: 0 0 60px rgba(212,32,32,0.7);
    }

    /* ── Casino-intro (skjult til filmen er ferdig) ── */
    #page {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #080808; overflow: hidden;
      opacity: 0; pointer-events: none;
      transition: opacity 1.2s ease;
    }
    #page.visible { opacity: 1; pointer-events: all; }

    #page::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 80% at 50% 50%, rgba(220,20,20,0.18) 0%, transparent 70%);
      animation: spotBreath 3s ease-in-out infinite alternate;
    }
    @keyframes spotBreath {
      from { opacity:0.6; transform:scale(1); }
      to   { opacity:1;   transform:scale(1.1); }
    }
    .card-ring { position: absolute; inset: 0; pointer-events: none; }
    .ring-card {
      position: absolute; width: 54px; height: 76px;
      border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem;
      background: rgba(20,20,20,0.9);
      animation: orbitCard linear infinite; transform-origin: 0 0;
    }
    .ring-card.red   { color: #d44; }
    .ring-card.black { color: #fff; }
    @keyframes orbitCard {
      from { transform: rotate(var(--start)) translateX(var(--r)) rotate(calc(-1 * var(--start))); }
      to   { transform: rotate(calc(var(--start) + 360deg)) translateX(var(--r)) rotate(calc(-1 * (var(--start) + 360deg))); }
    }
    .scanlines {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 6px);
      pointer-events: none;
    }
    .intro-title {
      position: relative; z-index: 2; text-align: center;
      display: flex; flex-direction: column; align-items: center;
    }
    .intro-eyebrow {
      font-size: 0.75rem; letter-spacing: 0.35em; text-transform: uppercase;
      color: #888; margin-bottom: 10px;
    }
    .intro-main {
      font-family: 'Bebas Neue', sans-serif; font-size: clamp(4rem,16vw,9rem);
      letter-spacing: 0.04em; line-height: 0.9; color: #fff;
      text-shadow: 0 0 60px var(--red-glow), 0 0 120px rgba(212,32,32,0.3);
    }
    .intro-line2 {
      font-family: 'Bebas Neue', sans-serif; font-size: clamp(1.8rem,6vw,3.4rem);
      letter-spacing: 0.12em; color: var(--red);
      text-shadow: 0 0 30px rgba(212,32,32,0.6);
    }
    .intro-divider {
      width: 80px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      margin: 18px 0;
    }
    .intro-tagline {
      font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: #666;
    }
    .intro-sender {
      font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: #444; margin-top: 14px;
    }
    .intro-sender span { color: #888; }
    #start-btn {
      position: relative; z-index: 2; margin-top: 44px; padding: 20px 60px;
      font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.1em;
      background: transparent; color: #fff; border: 2px solid var(--red);
      border-radius: 4px; cursor: pointer;
      transition: box-shadow 0.2s, transform 0.15s;
      box-shadow: 0 0 20px rgba(212,32,32,0.3); overflow: hidden;
    }
    #start-btn::before {
      content: ''; position: absolute; inset: 0; background: var(--red);
      transform: scaleX(0); transform-origin: left; transition: transform 0.25s ease; z-index: -1;
    }
    #start-btn:hover::before { transform: scaleX(1); }
    #start-btn:hover { box-shadow: 0 0 50px rgba(212,32,32,0.7); transform: translateY(-2px); }
    #start-btn:active { transform: translateY(0); }
    #start-btn::after {
      content: ''; position: absolute; inset: -6px;
      border: 1px solid rgba(212,32,32,0.4); border-radius: 6px;
      animation: btnPulse 2s ease-in-out 0.7s infinite;
    }
    @keyframes btnPulse { 0%,100%{opacity:0.4;transform:scale(1)} 50%{opacity:0;transform:scale(1.06)} }
    .click-hint {
      position: absolute; bottom: 32px; left: 0; right: 0;
      text-align: center; font-size: 0.7rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: #333;
    }
  </style>
</head>
<body>

<audio id="bg-music" src="simonsen-fjord-og-fest.mp3" preload="auto"></audio>

<!-- ── Video-intro overlay ── -->
<div id="video-overlay">
  <div id="yt-wrap">
    <!-- YT IFrame API fyller inn her -->
    <div id="yt-player"></div>
  </div>
  <!-- Svart maske som dekker teksting nederst, med logo -->
  <div id="subtitle-mask">
    <div id="video-logo">
      <svg width="32" height="32" viewBox="0 0 100 100" fill="none">
        <path d="M50 15L90 80H10L50 15Z" stroke="white" stroke-width="4" stroke-linejoin="round"/>
        <path d="M30 80L40 60L50 80H30Z" fill="white"/>
        <path d="M70 80L60 60L50 80H70Z" fill="white"/>
      </svg>
      <div class="logo-text">
        <span class="logo-name">SIMONSEN</span>
        <span class="logo-sub">FJORD &amp; FEST</span>
      </div>
    </div>
  </div>

  <!-- Klikk-for-å-starte (skjules etter start) -->
  <div id="tap-screen" onclick="startVideo()">
    <div class="tap-logo">CASINO</div>
    <div class="tap-play-btn">▶</div>
    <div class="tap-hint">Trykk for å starte</div>
  </div>
</div>

<!-- ── Casino-intro (vises etter video) ── -->
<div id="page">
  <div class="scanlines"></div>
  <div class="card-ring" id="card-ring"></div>
  <div class="intro-title">
    <div class="intro-eyebrow">Simonsen Fjord &amp; Fest presenterer</div>
    <div class="intro-main">CASINO</div>
    <div class="intro-line2">Høyere eller Lavere?</div>
    <div class="intro-divider"></div>
    <div class="intro-tagline">Kan du klare det?</div>
    <div class="intro-sender">Et spill fra <span>Simonsen Fjord &amp; Fest</span></div>
  </div>
  <button id="start-btn" onclick="goToGame()">▶ START SPILLET</button>
  <div class="click-hint">Trykk hvor som helst for å starte musikken</div>
</div>

<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
/* ── YouTube-video ── */
var ytPlayer;
var cutoffTimer = null;
var videoCut = 14; // sekunder før slutten

function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('yt-player', {
    videoId: 'j2wHUHZrabI',
    playerVars: {
      autoplay: 0,      // starter manuelt ved klikk
      controls: 0,
      disablekb: 1,
      fs: 0,
      iv_load_policy: 3,
      modestbranding: 1,
      rel: 0,
      playsinline: 1,
      cc_load_policy: 0,
    },
    events: {
      onReady: onPlayerReady,
      onStateChange: onPlayerStateChange,
    }
  });
}

function onPlayerReady(event) {
  // Klar til å spille; venter på bruker-klikk (tap-screen)
}

function startVideo() {
  // Skjul klikk-overlay
  document.getElementById('tap-screen').style.opacity = '0';
  document.getElementById('tap-screen').style.pointerEvents = 'none';

  if (ytPlayer && ytPlayer.playVideo) {
    ytPlayer.playVideo();
  }
}

function onPlayerStateChange(event) {
  // YT.PlayerState.PLAYING = 1
  if (event.data === YT.PlayerState.PLAYING && !cutoffTimer) {
    var duration = ytPlayer.getDuration();
    var currentTime = ytPlayer.getCurrentTime();
    var remaining = duration - currentTime;
    var cutAt = Math.max(0, (remaining - videoCut) * 1000);
    cutoffTimer = setTimeout(transitionToCasino, cutAt);
  }
  // Hvis videoen uventet slutter, overfør likevel
  if (event.data === YT.PlayerState.ENDED) {
    transitionToCasino();
  }
}

function transitionToCasino() {
  if (cutoffTimer) { clearTimeout(cutoffTimer); cutoffTimer = null; }

  // Fade ut video-overlay
  var overlay = document.getElementById('video-overlay');
  overlay.style.opacity = '0';

  // Fade inn casino-intro og start musikk
  var page = document.getElementById('page');
  page.classList.add('visible');

  videoFinished = true;
  tryPlayMusic();

  // Fjern overlay fra DOM etter fade er ferdig
  setTimeout(function() {
    if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
    overlay.style.display = 'none';
  }, 1300);
}

/* ── Musikk ── */
var bgMusic = document.getElementById('bg-music');
bgMusic.loop = false;
bgMusic.volume = 0.55;

var musicStarted = false;
var videoFinished = false; // musikk kan ikke starte før videoen er ferdig

function tryPlayMusic() {
  if (!videoFinished) return; // blokkert mens video kjører
  if (musicStarted) return;
  musicStarted = true;
  bgMusic.play().catch(function() { musicStarted = false; });
}

// Fallback: klikk/touch på casino-introen starter musikk (bare etter video)
document.addEventListener('click',      tryPlayMusic, { passive: true });
document.addEventListener('touchstart', tryPlayMusic, { passive: true });

function goToGame() {
  setTimeout(function() { window.location.href = 'casinospill.html'; }, 400);
}

/* ── Kortring-animasjon ── */
var RING_CARDS = [
  {val:'K',suit:'♠',red:false},{val:'A',suit:'♥',red:true},
  {val:'7',suit:'♦',red:true}, {val:'Q',suit:'♣',red:false},
  {val:'J',suit:'♥',red:true}, {val:'2',suit:'♠',red:false},
  {val:'9',suit:'♦',red:true}, {val:'4',suit:'♣',red:false},
  {val:'10',suit:'♥',red:true},{val:'5',suit:'♠',red:false},
  {val:'8',suit:'♦',red:true}, {val:'3',suit:'♣',red:false},
];
(function buildRing() {
  var ring = document.getElementById('card-ring');
  var r = Math.min(window.innerWidth, window.innerHeight) * 0.42;
  RING_CARDS.forEach(function(c, i) {
    var el = document.createElement('div');
    el.className = 'ring-card ' + (c.red ? 'red' : 'black');
    el.textContent = c.val + c.suit;
    var angle = (i / RING_CARDS.length) * 360;
    var dur   = 28 + (i % 3) * 4;
    el.style.cssText = 'left:50vw;top:50vh;--start:'+angle+'deg;--r:'+r+'px;animation-duration:'+dur+'s;animation-delay:-'+((i/RING_CARDS.length)*dur)+'s;opacity:'+(0.25+(i%4)*0.07)+';';
    ring.appendChild(el);
  });
})();
</script>
</body>
</html>
